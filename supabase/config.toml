
[functions.text-to-speech]
enabled = true
verify_jwt = false
import_map = "./functions/text-to-speech/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/text-to-speech/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/text-to-speech/*.html" ]

# ── Auth (local `supabase start` only; the hosted project is configured in the dashboard — docs/AUTHENTICATION.md) ──
# Google is the only way in. No anonymous users, no email/password, no OTP.
[auth]
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
# The app sends a nonce with every sign-in; keep its check on.
skip_nonce_check = false
