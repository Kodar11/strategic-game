# ── Auth (local `supabase start` only; the hosted project is configured in the dashboard — docs/AUTHENTICATION.md) ──
# Google is the only way in. No anonymous users, no email/password, no OTP.
[auth]
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
# The app sends a nonce with every sign-in; keep its check on.
skip_nonce_check = false

# Game of the Week: server-run Strategy Arena matches (docs/GAME_OF_THE_WEEK.md). The function also verifies the
# caller with Supabase Auth itself, so it stays safe with either JWT setting.
[functions.arena-match]
enabled = true
verify_jwt = true
entrypoint = "./functions/arena-match/index.ts"

# Account deletion: deletes deleted accounts' PostHog persons, events and recordings (docs/ACCOUNT_DELETION.md).
# Called by pg_cron, not by users, so there is no user JWT to verify; the function refuses every request that lacks
# the DELETION_WORKER_SECRET header before doing any work.
[functions.posthog-deletion]
enabled = true
verify_jwt = false
entrypoint = "./functions/posthog-deletion/index.ts"
